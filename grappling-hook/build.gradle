plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

loom {
    accessWidenerPath = file("src/main/resources/grapplinghook.accesswidener")

    runs {
        gametest {
            inherit server
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def expansions = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version,
            yacl_version     : project.yacl_version,
            modmenu_version  : project.modmenu_version
    ]
    inputs.properties expansions
    filesMatching("fabric.mod.json") {
        expand expansions
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << '-Xmaxerrs' << '9999'
}
