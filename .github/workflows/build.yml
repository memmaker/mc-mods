name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches the Gradle and Fabric Loom downloads, which dwarf the mods themselves.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build every mod
        run: ./build.sh

      - name: Run every mod's game tests
        run: ./test.sh

      - name: Upload jars as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: "*.jar"
          if-no-files-found: error

      # Releases only from the default branch, so branch and PR builds stay artifacts.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ./*.jar \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build of ${GITHUB_SHA:0:7} — $(git log -1 --pretty=%s)"
