plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom { splitEnvironmentSourceSets() }

fabricApi { configureDataGeneration { client = true } }

loom {
    runs {
        gametest {
            inherit server
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

sourceSets {
    client { }
}

// Vendored Camerapture: when you copy the Camerapture sources into
// photo-safari/vendor/camerapture (run photo-safari/vendor/import_camerapture.sh),
// include the Java + resource dirs so the code is compiled into the photosafari jar.
sourceSets.main.java.srcDirs += file('vendor/camerapture/common/src/main/java')
sourceSets.main.java.srcDirs += file('vendor/camerapture/fabric/src/main/java')
sourceSets.main.resources.srcDirs += file('vendor/camerapture/common/src/main/resources')
sourceSets.main.resources.srcDirs += file('vendor/camerapture/fabric/src/main/resources')
sourceSets.client.java.srcDirs += file('vendor/camerapture/common/src/client/java')
sourceSets.client.resources.srcDirs += file('vendor/camerapture/common/src/client/resources')

loom {
    mods {
        "photosafari" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Camerapture is vendored into this project (copy & own). Remove external dependency.
    // implementation "maven.modrinth:camerapture:${project.camerapture_version}"

    // Mod Menu supplies the config button only. The entrypoint that touches its API is never
    // loaded without it, so the published jar works fine on its own — compile-only here,
    // present in runClient so the screen can actually be opened in dev.
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Datagen only: their mobs get checklist advancements, gated behind a resource
    // condition so the same jar still works without them installed.
    implementation "maven.modrinth:alexs-mobs-continued:${project.alexs_mobs_version}"
    implementation "maven.modrinth:codxlib:${project.codxlib_version}"

    testImplementation platform('org.junit:junit-bom:6.1.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
